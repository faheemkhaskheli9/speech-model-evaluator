[project]
name = "speech-model-evaluator"
version = "0.1.0"
description = "Speech-to-Text / TTS Evaluation Toolkit"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
sme-assemble = "sme.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
